<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 500px;
            border:2px solid black;
        }
        .header,.footer{
            height: 20%;
            background-color: teal;
        }
        .center{
            display: flex;
            height: 60%;
            background-color: brown;
        }
        .footer{
            height: 20%;
            background-color: burlywood;
        }
        .left{
            height: 100%;
            width: 30%;
            background-color: blue;
        }
        .right{
           height: 100%;
           width: 70%;
           background-color: yellow; 
        }
        .top{
            height: 50%;
            background-color: aqua;
        }
        .bottom{
            height: 50%;
            background-color: green;
            display: flex;
        }
        .bottom1{
            height: 100%;
            width: 50%;
            background-color: beige;
        }
        .bottom2{
            height: 100%;
            width: 50%;
            background-color: rgb(198, 198, 38);
        }
    </style>
</head>
<body>
    <h1 align="center"> Flex Box </h1>
    <div class="container">
        <div class="header"></div>
        <div class="center">
            <div class="left"> </div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="bottom1"></div>
                    <div class="bottom2"></div>
                </div>
            </div>
        </div>
        <div class="footer"></div>
         </div>

    
</body>
</html>
